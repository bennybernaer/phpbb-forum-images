<div role="region" class="forumimages-panel{% if not FORUMIMAGES_CAROUSEL %} forumimages-panel-static{% endif %}" style="--forumimages-size: {{ FORUMIMAGES_SIZE }}px;" aria-label="{{ lang('FORUMIMAGES_RECENT_IMAGES') }}"{% if FORUMIMAGES_CAROUSEL %} data-forumimages-carousel{% endif %}>
    <div class="forumimages-inner">
        <div class="forumimages-strip" data-forumimages-strip>
            <div class="forumimages-track" data-forumimages-track>
                {% for image in forumimages %}
                    <a class="forumimages-item" href="{{ image.POST_URL }}" title="{{ image.ALT }}">
                        <img src="{{ image.IMAGE_URL }}" alt="{{ image.ALT }}" loading="lazy" decoding="async">
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
